[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "hue-mcp"
version = "0.1.0"
description = "MCP server that lets Claude control Philips Hue lights through a Hue Bridge"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "anyio>=4.7,<5",
    "astral>=3.2,<4",
    "httpx2>=2.13,<3",
    "mcp>=2.2,<3",
    "pydantic>=2.11,<3",
    "zeroconf>=0.150,<1",
]

[project.optional-dependencies]
# Exact pins keep lint and type results reproducible; Dependabot proposes upgrades.
dev = [
    "mypy==2.4.0",
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "ruff==0.17.5",
]

[project.scripts]
hue-mcp = "hue_mcp.cli:main"

[tool.setuptools.package-data]
hue_mcp = ["hue_roots.pem"]

[tool.ruff]
line-length = 99
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RUF", "S", "PT", "ASYNC"]

[tool.ruff.lint.isort]
known-local-folder = ["conftest"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S103", "S105"]

[tool.mypy]
files = ["src", "scripts"]
strict = true

[[tool.mypy.overrides]]
# The screen capture helper runs on the system Python, whose PyGObject isn't in the venv.
module = ["gi", "gi.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# The race helper runs in a ROS 2 workspace's environment, whose packages aren't in the venv.
module = ["rclpy", "rclpy.*", "race_msgs", "race_msgs.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-markers"]
filterwarnings = ["error"]

[tool.coverage.run]
source = ["hue_mcp"]
branch = true
# The helpers run outside the venv: screen capture on the system Python, with the desktop's
# screen sharing, and the race listener in a ROS 2 workspace. Checked by hand, and by the tests
# that keep their constants in step with hue_mcp.screen and hue_mcp.race.
omit = ["*/hue_mcp/screen_capture.py", "*/hue_mcp/race_listener.py"]

[tool.coverage.report]
show_missing = true
fail_under = 98
